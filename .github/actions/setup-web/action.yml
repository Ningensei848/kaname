name: Prepare pinned Web build environment
description: Prepare the fixed Python, Chromium, Node and Web engine dependencies
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-python
      with:
        browser: 'true'
    - uses: actions/setup-node@v7
      with:
        node-version: '24.15.0'
        cache: npm
        cache-dependency-path: web/package-lock.json
    - name: Prepare and audit the fixed Web engine
      shell: bash
      working-directory: web
      run: |
        set -euo pipefail
        npm ci --ignore-scripts
        node --test audit.test.mjs
        npm run audit
        npm run setup

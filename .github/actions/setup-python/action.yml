name: Prepare pinned Python environment
description: Install fixed Python dependencies without credentials or job permission changes
inputs:
  browser:
    description: Install the fixed browser dependencies and Chromium
    default: 'false'
  editable:
    description: Install the local package without resolving dependencies
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: pip
    - name: Install pinned dependencies
      shell: bash
      env:
        INSTALL_BROWSER: ${{ inputs.browser }}
        INSTALL_EDITABLE: ${{ inputs.editable }}
      run: |
        set -euo pipefail
        if [[ "$INSTALL_BROWSER" == true ]]; then
          python -m pip install -r requirements.lock -r requirements-browser.lock
        else
          python -m pip install -r requirements.lock
        fi
        if [[ "$INSTALL_EDITABLE" == true ]]; then
          python -m pip install --no-deps -e .
        fi
        if [[ "$INSTALL_BROWSER" == true ]]; then
          python -m playwright install --with-deps chromium
        fi

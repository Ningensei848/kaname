name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: |
          python -m pip install -r requirements.lock -r requirements-browser.lock
          python -m pip install --no-deps -e .
          python -m playwright install --with-deps chromium
      - run: |
          python -m techkb validate-config
          python -m pytest -q
  web-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: |
          python -m pip install -r requirements.lock -r requirements-browser.lock
          python -m playwright install --with-deps chromium
      - working-directory: web
        run: |
          npm ci --ignore-scripts
          node --test audit.test.mjs
          npm run audit
          npm run setup
          python make_fixture.py
          python build.py
          python check_preview.py --screenshots ../web/.cache/screenshots
      - uses: actions/checkout@v5
        with:
          ref: content
          path: public-content
          fetch-depth: 1
          persist-credentials: false
      - name: Validate Pages against the actual public content
        working-directory: web
        run: |
          commit=$(git -C ../public-content rev-parse HEAD)
          python build_pages.py --content ../public-content --content-commit "$commit" --output .cache/pages-artifact
          python check_pages.py --content ../public-content --content-commit "$commit" --artifact .cache/pages-artifact
      - uses: actions/upload-artifact@v7
        with:
          name: kaname-web-validation
          path: web/public/*
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: kaname-web-preview-screenshots
          path: web/.cache/screenshots/*.png
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.select.outputs.python }}
      web: ${{ steps.select.outputs.web }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/check_scope.py --base "$BASE_SHA" --head "$HEAD_SHA"
  python-checks:
    needs: scope
    if: needs.scope.outputs.python != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-python
        with:
          browser: ${{ needs.scope.outputs.python == 'full' }}
          editable: 'true'
      - env:
          CHECK_SCOPE: ${{ needs.scope.outputs.python }}
        run: python scripts/check_scope.py --run "$CHECK_SCOPE"
  web-checks:
    needs: scope
    if: needs.scope.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-web
      - working-directory: web
        run: |
          npm --silent run fixture
          npm --silent run build
          npm --silent run check:preview -- --screenshots ../web/.cache/screenshots
      - uses: actions/checkout@v5
        with:
          ref: content
          path: public-content
          fetch-depth: 1
          persist-credentials: false
      - name: Validate Pages against the actual public content
        working-directory: web
        run: |
          commit=$(git -C ../public-content rev-parse HEAD)
          npm --silent run build:pages -- --content ../public-content --content-commit "$commit" --output .cache/pages-artifact
          npm --silent run check:pages -- --content ../public-content --content-commit "$commit" --artifact .cache/pages-artifact
      - uses: actions/upload-artifact@v7
        with:
          name: kaname-web-validation
          path: web/public/*
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: kaname-web-preview-screenshots
          path: web/.cache/screenshots/*.png
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  test:
    needs: [scope, python-checks]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          CHECK_RESULT: ${{ needs.python-checks.result }}
          SELECTED: ${{ needs.scope.outputs.python }}
        run: |
          test "$SCOPE_RESULT" = success
          if [[ "$SELECTED" == none ]]; then
            test "$CHECK_RESULT" = skipped
          else
            test "$CHECK_RESULT" = success
          fi
  web-preview:
    needs: [scope, web-checks]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          CHECK_RESULT: ${{ needs.web-checks.result }}
          SELECTED: ${{ needs.scope.outputs.web }}
        run: |
          test "$SCOPE_RESULT" = success
          if [[ "$SELECTED" == false ]]; then
            test "$CHECK_RESULT" = skipped
          else
            test "$CHECK_RESULT" = success
          fi

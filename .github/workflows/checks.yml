name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  repository-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check documentation paths and anchors
        run: python3 scripts/check_docs.py
      - name: Check workflow syntax with pinned actionlint
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$archive"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes=
  scope:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.select.outputs.python }}
      web: ${{ steps.select.outputs.web }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/check_scope.py --base "$BASE_SHA" --head "$HEAD_SHA"
  python-checks:
    needs: scope
    if: needs.scope.outputs.python != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-python
        with:
          browser: ${{ needs.scope.outputs.python == 'full' }}
          editable: 'true'
      - env:
          CHECK_SCOPE: ${{ needs.scope.outputs.python }}
        run: python scripts/check_scope.py --run "$CHECK_SCOPE"
  web-checks:
    needs: scope
    if: needs.scope.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-web
      - name: Test browser validation boundaries
        run: python -m pytest -q web/tests
      - working-directory: web
        run: |
          npm --silent run fixture
          npm --silent run build
          npm --silent run check:preview -- --screenshots ../web/.cache/screenshots
      - uses: actions/checkout@v5
        with:
          ref: content
          path: public-content
          fetch-depth: 1
          persist-credentials: false
      - name: Validate Pages against the actual public content
        working-directory: web
        run: |
          commit=$(git -C ../public-content rev-parse HEAD)
          npm --silent run build:pages -- --content ../public-content --content-commit "$commit" --output .cache/pages-artifact
          npm --silent run check:pages -- --content ../public-content --content-commit "$commit" --artifact .cache/pages-artifact
      - name: Verify the same artifact against restored Release bytes
        env:
          PYTHONPATH: src:web
        run: |
          set -euo pipefail
          export CONTENT_COMMIT=$(git -C public-content rev-parse HEAD)
          python - <<'PY'
          import os, tempfile
          from pathlib import Path
          from techkb.publication import PUBLIC_README, json_bytes
          from techkb.publication.git_snapshot import content_snapshot
          from techkb.publication.install import install_snapshot
          from techkb.release_bundle import build_bundle, apply_bundle
          from kaname_web.pages import prepare_pages
          commit = os.environ['CONTENT_COMMIT']
          _, files, _ = content_snapshot('public-content', commit)
          with tempfile.TemporaryDirectory(dir='web/.cache') as temporary:
              root = Path(temporary) / 'source'
              install_snapshot(root, dict(files, **{'README.md': PUBLIC_README}))
              value, packed = build_bundle(root, commit)
              _, restored, _ = apply_bundle(value, packed)
              install_snapshot(Path('release-content'), restored)
              Path('release-receipt.json').write_bytes(json_bytes(value))
              prepare_pages('release-content', commit, 'web/.cache/pages-artifact',
                            Path(temporary) / 'pages', 'release-receipt.json')
          PY
          cd web
          npm --silent run check:pages -- --content ../release-content --content-commit "$CONTENT_COMMIT" \
            --release-receipt ../release-receipt.json --artifact .cache/pages-artifact
      - uses: actions/upload-artifact@v7
        with:
          name: kaname-web-validation
          path: web/public/*
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: kaname-web-preview-screenshots
          path: web/.cache/screenshots/*.png
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  test:
    needs: [scope, python-checks, repository-checks]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          CHECK_RESULT: ${{ needs.python-checks.result }}
          SELECTED: ${{ needs.scope.outputs.python }}
          REPOSITORY_RESULT: ${{ needs.repository-checks.result }}
        run: |
          test "$REPOSITORY_RESULT" = success
          test "$SCOPE_RESULT" = success
          if [[ "$SELECTED" == none ]]; then
            test "$CHECK_RESULT" = skipped
          else
            test "$CHECK_RESULT" = success
          fi
  web-preview:
    needs: [scope, web-checks]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          CHECK_RESULT: ${{ needs.web-checks.result }}
          SELECTED: ${{ needs.scope.outputs.web }}
        run: |
          test "$SCOPE_RESULT" = success
          if [[ "$SELECTED" == false ]]; then
            test "$CHECK_RESULT" = skipped
          else
            test "$CHECK_RESULT" = success
          fi

name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-python
        with:
          browser: 'true'
          editable: 'true'
      - run: |
          python -m techkb validate-config
          python -m pytest -q
  web-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-web
      - working-directory: web
        run: |
          npm --silent run fixture
          npm --silent run build
          npm --silent run check:preview -- --screenshots ../web/.cache/screenshots
      - uses: actions/checkout@v5
        with:
          ref: content
          path: public-content
          fetch-depth: 1
          persist-credentials: false
      - name: Validate Pages against the actual public content
        working-directory: web
        run: |
          commit=$(git -C ../public-content rev-parse HEAD)
          npm --silent run build:pages -- --content ../public-content --content-commit "$commit" --output .cache/pages-artifact
          npm --silent run check:pages -- --content ../public-content --content-commit "$commit" --artifact .cache/pages-artifact
      - uses: actions/upload-artifact@v7
        with:
          name: kaname-web-validation
          path: web/public/*
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: kaname-web-preview-screenshots
          path: web/.cache/screenshots/*.png
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

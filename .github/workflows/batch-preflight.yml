name: Batch acceptance preflight
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    # WIF authentication remains on main, separate from pull-request checks.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: techkb-gcs-single-writer
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python
        with:
          editable: 'true'
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: Read state, receipts and accounting without writes
        env:
          GCS_BUCKET: ${{ vars.GCS_BUCKET }}
        run: python scripts/batch_preflight.py

# Before enabling a source, review its terms and robots policy.
sources:
  - id: google-research
    name: Google Research
    enabled: true
    type: rss
    feed_url: https://research.google/blog/rss/
    base_url: https://research.google/
    # Keep all body sections and figures; exclude navigation and related posts.
    extract_main: true
    content_selector: .blog-detail-wrapper
    request_interval_seconds: 2
    tags: [research]
  - id: github-blog
    name: GitHub Blog
    enabled: true
    type: rss
    feed_url: https://github.blog/feed/
    base_url: https://github.blog/
    request_interval_seconds: 2
    tags: [software-development]
  - id: aws-news
    name: AWS News Blog
    # AWS Site Terms prohibit robots/data-extraction tools without express consent.
    # Keep disabled unless written permission or a separate applicable license is confirmed.
    enabled: false
    type: rss
    feed_url: https://aws.amazon.com/blogs/aws/feed/
    base_url: https://aws.amazon.com/
    request_interval_seconds: 2
    tags: [cloud]

  # Google DeepMind: AI and foundational research
  - id: google-deepmind
    name: Google DeepMind
    enabled: true
    type: rss
    feed_url: https://deepmind.google/blog/rss.xml
    base_url: https://deepmind.google/
    request_interval_seconds: 2
    tags: [ai-llm, research]

  # Microsoft Research: CS and AI research
  - id: microsoft-research
    name: Microsoft Research Blog
    enabled: true
    type: rss
    feed_url: https://www.microsoft.com/en-us/research/blog/feed/
    base_url: https://www.microsoft.com/en-us/research/
    request_interval_seconds: 2
    tags: [research]

  # Meta: large-scale engineering and AI infrastructure
  - id: meta-engineering
    name: Engineering at Meta
    enabled: true
    type: rss
    feed_url: https://engineering.fb.com/feed/
    base_url: https://engineering.fb.com/
    request_interval_seconds: 2
    tags: [software-development, ai-llm]

  # Apple: machine learning research
  - id: apple-ml-research
    name: Apple Machine Learning Research
    enabled: true
    type: rss
    feed_url: https://machinelearning.apple.com/rss.xml
    base_url: https://machinelearning.apple.com/
    request_interval_seconds: 2
    tags: [ai-llm, research]

  # Cloudflare: security engineering
  - id: cloudflare-security
    name: Cloudflare Security Blog
    enabled: true
    type: rss
    feed_url: https://blog.cloudflare.com/tag/security/rss
    base_url: https://blog.cloudflare.com/
    request_interval_seconds: 2
    tags: [cybersecurity]
